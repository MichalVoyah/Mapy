# ☁️ Měsíční stavba map TSR pro celou Evropu (14. 11. 2026).
# Geofabrik → stav_pack.py po státech (8 dílů souběžně) → zipy do DRAFT vydání → publikuj.py
# (pojistky) → vydání se zveřejní jako „latest". Vozy čtou releases/latest/download/manifest.tsv.
# Selže-li kterýkoli díl, vydání zůstane draft a vozy jedou dál na minulém měsíci.
name: Mapy TSR

on:
  schedule:
    - cron: "0 2 2 * *"        # 2. den v měsíci 02:00 UTC (Geofabrik má extrakty z půlnoci)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mapy
  cancel-in-progress: false

env:
  DILU: "8"
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      datum: ${{ steps.t.outputs.datum }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: t
        run: |
          d=$(date -u +%Y%m%d)
          echo "datum=$d" >> "$GITHUB_OUTPUT"
          echo "tag=mapy-$d-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Plán (jednou pro všechny díly)
        run: TSR_MAPY_PRAC="$RUNNER_TEMP/prac" python3 evropa.py --suchy --plan-ven plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json
      - name: Draft vydání
        run: gh release create "${{ steps.t.outputs.tag }}" --draft --title "Mapy TSR ${{ steps.t.outputs.datum }}" --notes "Stavba běží."

  stavba:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        dil: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Závislosti
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q time
          pip install "osmium>=4.0,<5" "numpy>=2,<3"
      - uses: actions/download-artifact@v4
        with:
          name: plan
      # ⭐ 14. 11. 2026: díly 3 a 6 visely hodiny → strop kroku; co se do té doby postavilo, se nahraje
      #    (continue-on-error), chybějící státy posoudí publikuj.py (vozy si nechají minulou verzi)
      - name: Stavba dílu ${{ matrix.dil }}
        timeout-minutes: 200
        continue-on-error: true
        run: TSR_MAPY_PRAC="$RUNNER_TEMP/prac" python3 evropa.py --plan plan.json --dil "${{ matrix.dil }}/$DILU" --zip-do dist --uklid
      - name: Nahrát packy do vydání
        if: always()
        run: |
          shopt -s nullglob
          for z in dist/*.zip; do gh release upload "${{ needs.plan.outputs.tag }}" "$z" --clobber; done
      - uses: actions/upload-artifact@v4
        with:
          name: dil-${{ matrix.dil }}
          path: |
            dist/*.tsv
            dist/*.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ matrix.dil }}
          path: ${{ runner.temp }}/prac/evropa.log

  # ⭐ 14. 11. 2026: runner dílu 2 byl 2× bez sítě („Network is unreachable") → nepovedené státy
  #    ze všech dílů se postaví znovu na JINÉM stroji, teprve pak publikace.
  dohanka:
    needs: [plan, stavba]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: dil-*
          path: dily
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - id: co
        name: Co dohnat
        run: |
          ids=$(cat dily/*/chyby-*.txt 2>/dev/null | sort -u | paste -sd, -)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "Dohnat: ${ids:-nic}"
      - name: Závislosti
        if: steps.co.outputs.ids != ''
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q time
          pip install "osmium>=4.0,<5" "numpy>=2,<3"
      - name: Stavba dohnaných
        if: steps.co.outputs.ids != ''
        timeout-minutes: 180
        continue-on-error: true
        run: TSR_MAPY_PRAC="$RUNNER_TEMP/prac" python3 evropa.py --plan plan.json --ids "${{ steps.co.outputs.ids }}" --dil-jmeno dohanka --zip-do dist --uklid
      - name: Nahrát dohnané
        if: steps.co.outputs.ids != ''
        run: |
          shopt -s nullglob
          for z in dist/*.zip; do gh release upload "${{ needs.plan.outputs.tag }}" "$z" --clobber; done
      - uses: actions/upload-artifact@v4
        if: steps.co.outputs.ids != ''
        with:
          name: dil-dohanka
          path: dist/manifest-*.tsv
          if-no-files-found: ignore

  publikace:
    needs: [plan, stavba, dohanka]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: dil-*
          path: dily
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: Minulý manifest (pojistka poklesu)
        run: gh release download --pattern manifest.tsv --output stary.tsv || echo "minulý manifest není"
      - name: Manifest + pojistky
        run: |
          python3 publikuj.py --dily dily --plan plan.json --tag "${{ needs.plan.outputs.tag }}" \
            --datum "${{ needs.plan.outputs.datum }}" --predchozi stary.tsv --ven manifest.tsv --poznamky notes.md
      - name: Zveřejnit
        run: |
          gh release upload "${{ needs.plan.outputs.tag }}" manifest.tsv --clobber
          gh release edit "${{ needs.plan.outputs.tag }}" --draft=false --latest --notes-file notes.md
      - name: Úklid starých vydání (nechat 2 poslední + běžící)
        run: |
          gh release list --limit 100 --json tagName,isDraft,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[] | [.tagName, .isDraft] | @tsv' > vydani.tsv
          n=0
          while IFS=$'\t' read -r tag draft; do
            if [ "$tag" = "${{ needs.plan.outputs.tag }}" ]; then n=$((n+1)); continue; fi
            # draft nemá tag (14. 11.: --cleanup-tag → HTTP 422 a červený běh) → bez něj; úklid nikdy neshodí běh
            if [ "$draft" = "true" ]; then gh release delete "$tag" --yes || echo "draft $tag nesmazán"; continue; fi
            n=$((n+1))
            if [ "$n" -gt 2 ]; then gh release delete "$tag" --yes --cleanup-tag || echo "$tag nesmazán"; fi
          done < vydani.tsv

  # ⭐ GitHub u veřejných repozitářů VYPNE naplánované běhy po 60 dnech bez commitu (vydání se nepočítá).
  #    Každý měsíční běh proto zapíše malý soubor se stavem — i když stavba selže (if: always()).
  udrzba:
    needs: [plan, stavba, publikace]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Zapsat poslední stavbu (drží plánovač při životě)
        run: |
          {
            echo "Poslední stavba map: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Vydání: ${{ needs.plan.outputs.tag }}"
            echo "Výsledek: plán=${{ needs.plan.result }} stavba=${{ needs.stavba.result }} publikace=${{ needs.publikace.result }}"
          } > posledni-stavba.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posledni-stavba.txt
          git commit -m "Stav měsíční stavby ${{ needs.plan.outputs.datum }}" || echo "beze změny"
          # někdo mezitím commitnul (14. 11.: nahrávání přes web během běhu) → dorovnat a zkusit znovu
          for k in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
